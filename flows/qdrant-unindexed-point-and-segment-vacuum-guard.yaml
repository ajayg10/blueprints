id: qdrant-unindexed-point-and-segment-vacuum-guard
namespace: company.ai

description: |
  Audit Qdrant vector collections for unindexed vector backlogs, optimizer stalls, and dead point accumulation across segments.
  Track indexing lag and segment bloat across runs in Kestra KV, distinguish active streaming ingestion from stalled optimizers,
  pause for operator approval, trigger aggressive background indexing and segment vacuuming via the Qdrant REST API,
  and verify index convergence and query latency with a canary ANN search benchmark.

inputs:
  - id: qdrant_url
    type: STRING
    displayName: Qdrant REST API URL
    description: Base HTTP(S) URL of the Qdrant service reachable from the Kestra worker (e.g. http://localhost:6333 or https://xyz.cloud.qdrant.io).
    defaults: "http://localhost:6333"

  - id: collection_name
    type: STRING
    displayName: Target Collection Name
    description: Name of the Qdrant vector collection to audit, vacuum, and index.
    defaults: "enterprise_knowledge_base"

  - id: unindexed_points_threshold
    type: INT
    displayName: Unindexed Points Threshold
    description: Minimum number of unindexed vectors in a collection before flagging as an indexing lag candidate.
    defaults: 1000

  - id: unindexed_ratio_threshold_pct
    type: INT
    displayName: Unindexed Ratio Threshold (%)
    description: Maximum acceptable percentage of unindexed vectors relative to total vectors (e.g. 10%).
    defaults: 10

  - id: min_consecutive_runs
    type: INT
    displayName: Minimum Consecutive Lagged Runs
    description: Number of consecutive audit passes an unindexed backlog must persist before triggering remediation.
    defaults: 2

  - id: temp_indexing_threshold
    type: INT
    displayName: Temporary Indexing Threshold
    description: Reduced indexing_threshold applied during forced optimization to compel Qdrant to merge small segments and build HNSW graphs.
    defaults: 500

  - id: temp_deleted_threshold
    type: FLOAT
    displayName: Temporary Deleted Points Threshold
    description: Reduced deleted_threshold ratio (0.01 - 0.20) applied during optimization to trigger aggressive vacuuming of tombstoned vectors.
    defaults: 0.05

  - id: cursor_key
    type: STRING
    displayName: KV Cursor Key
    description: Kestra KV key used to persist per-collection indexing history and trend state across runs.
    defaults: "qdrant_vacuum_guard_tracker"

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, audits collection indexing metrics and logs proposed optimization actions without modifying optimizer parameters.
    defaults: true

  - id: auto_remediate
    type: BOOL
    displayName: Auto Remediate
    description: When true and dry_run is false, pauses for operator sign-off and triggers aggressive segment vacuuming and canary validation.
    defaults: false

triggers:
  - id: periodic_indexing_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audit Qdrant collection indexing lag and segment fragmentation every 2 hours.
    cron: "0 */2 * * *"
    disabled: true

  - id: on_demand_vacuum_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by ingestion pipelines, CDC consumers, or alert runbooks.
    key: "{{ secret('QDRANT_GUARD_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Assert Qdrant connection URL, collection identifier, and threshold parameters satisfy operational bounds.
    conditions:
      - "{{ inputs.qdrant_url | length > 0 }}"
      - "{{ inputs.collection_name | length > 0 }}"
      - "{{ inputs.unindexed_points_threshold >= 10 }}"
      - "{{ inputs.unindexed_ratio_threshold_pct >= 1 and inputs.unindexed_ratio_threshold_pct <= 90 }}"
      - "{{ inputs.min_consecutive_runs >= 1 }}"
      - "{{ inputs.temp_indexing_threshold >= 100 }}"
      - "{{ inputs.temp_deleted_threshold > 0.0 and inputs.temp_deleted_threshold < 1.0 }}"
    errorMessage: "Invalid configuration: qdrant_url and collection_name are required, and threshold parameters must fall within supported bounds."

  - id: audit_collection_segments
    type: io.kestra.plugin.scripts.python.Script
    description: Inspect Qdrant collection status, evaluate unindexed point ratios and segment counts, read baseline optimizer config, and diff against KV state.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      QDRANT_URL: "{{ inputs.qdrant_url }}"
      COLLECTION_NAME: "{{ inputs.collection_name }}"
      UNINDEXED_THRESH: "{{ inputs.unindexed_points_threshold }}"
      UNINDEXED_RATIO_THRESH: "{{ inputs.unindexed_ratio_threshold_pct }}"
      MIN_CONSECUTIVE_RUNS: "{{ inputs.min_consecutive_runs }}"
      API_KEY: "{{ secret('QDRANT_API_KEY') ?? '' }}"
      EXECUTION_ID: "{{ execution.id }}"
      PREVIOUS_STATE_JSON: "{{ kv(inputs.cursor_key, errorOnMissing=false) ?? '{}' }}"
    script: |
      import json
      import os
      from datetime import datetime, timezone

      try:
          from kestra import Kestra
      except ImportError:
          Kestra = None

      import requests

      now_iso = datetime.now(timezone.utc).isoformat()
      qdrant_url = os.environ.get("QDRANT_URL", "").rstrip("/")
      collection_name = os.environ.get("COLLECTION_NAME", "enterprise_knowledge_base")
      unindexed_thresh = int(os.environ.get("UNINDEXED_THRESH", "1000"))
      unindexed_ratio_thresh = float(os.environ.get("UNINDEXED_RATIO_THRESH", "10.0"))
      min_consecutive_runs = int(os.environ.get("MIN_CONSECUTIVE_RUNS", "2"))
      api_key = os.environ.get("API_KEY", "").strip()
      execution_id = os.environ.get("EXECUTION_ID", "manual")

      prev_state_raw = os.environ.get("PREVIOUS_STATE_JSON", "{}")
      try:
          prev_state = json.loads(prev_state_raw) if prev_state_raw.strip() else {}
      except Exception:
          prev_state = {}

      headers = {"Accept": "application/json"}
      if api_key:
          headers["api-key"] = api_key

      # 1. Fetch collection info
      resp = requests.get(f"{qdrant_url}/collections/{collection_name}", headers=headers, timeout=20)
      if resp.status_code != 200:
          raise ValueError(f"Failed to fetch collection '{collection_name}' ({resp.status_code}): {resp.text}")

      res_data = resp.json().get("result", {})
      status = str(res_data.get("status", "unknown")).lower()
      optimizer_status_obj = res_data.get("optimizer_status", "ok")
      optimizer_status = "ok" if optimizer_status_obj == "ok" else str(optimizer_status_obj)

      vectors_count = int(res_data.get("vectors_count", 0) or 0)
      indexed_vectors_count = int(res_data.get("indexed_vectors_count", 0) or 0)
      points_count = int(res_data.get("points_count", 0) or 0)
      segments_count = int(res_data.get("segments_count", 0) or 0)

      # Extract current optimizer config for baseline restoration
      config_obj = res_data.get("config", {})
      optimizer_config = config_obj.get("optimizer_config", {})
      baseline_indexing_threshold = optimizer_config.get("indexing_threshold", 20000)
      baseline_deleted_threshold = optimizer_config.get("deleted_threshold", 0.2)

      unindexed_points = max(0, vectors_count - indexed_vectors_count)
      unindexed_ratio_pct = round((unindexed_points / max(1, vectors_count) * 100.0), 2)

      collection_key = f"{qdrant_url}/{collection_name}"
      prev_entry = prev_state.get(collection_key, {})
      prev_consecutive = int(prev_entry.get("consecutive_lagged_runs", 0))

      has_lag = (unindexed_points >= unindexed_thresh) or (unindexed_ratio_pct >= unindexed_ratio_thresh)
      consecutive_runs = prev_consecutive + 1 if has_lag else 0

      new_state_snapshot = dict(prev_state)
      new_state_snapshot[collection_key] = {
          "status": status,
          "optimizer_status": optimizer_status,
          "vectors_count": vectors_count,
          "indexed_vectors_count": indexed_vectors_count,
          "unindexed_points": unindexed_points,
          "unindexed_ratio_pct": unindexed_ratio_pct,
          "segments_count": segments_count,
          "consecutive_lagged_runs": consecutive_runs,
          "last_evaluated_at": now_iso,
      }

      is_critical = (unindexed_points >= (unindexed_thresh * 5)) or (optimizer_status != "ok")
      is_chronic = has_lag and consecutive_runs >= min_consecutive_runs
      needs_optimization = is_critical or is_chronic

      overall_status = "CRITICAL_INDEXING_LAG" if is_critical else ("CHRONIC_INDEXING_LAG" if is_chronic else ("MODERATE_LAG" if has_lag else "OPTIMIZED"))

      summary_text = (
          f"Qdrant Guard: {overall_status} | Collection '{collection_name}'. "
          f"Status: {status}, Optimizer: {optimizer_status}. Vectors: {vectors_count} (Indexed: {indexed_vectors_count}, "
          f"Unindexed: {unindexed_points} [{unindexed_ratio_pct}%]). Segments: {segments_count}. Needs optimization: {needs_optimization}."
      )
      print(summary_text)

      audit_manifest = {
          "overall_status": overall_status,
          "collection_name": collection_name,
          "qdrant_url": qdrant_url,
          "status": status,
          "optimizer_status": optimizer_status,
          "vectors_count": vectors_count,
          "indexed_vectors_count": indexed_vectors_count,
          "unindexed_points": unindexed_points,
          "unindexed_ratio_pct": unindexed_ratio_pct,
          "segments_count": segments_count,
          "baseline_indexing_threshold": baseline_indexing_threshold,
          "baseline_deleted_threshold": baseline_deleted_threshold,
          "consecutive_runs": consecutive_runs,
          "needs_optimization": needs_optimization,
          "evaluated_at": now_iso,
          "execution_id": execution_id,
      }

      if Kestra:
          Kestra.outputs({
              "needs_optimization": needs_optimization,
              "overall_status": overall_status,
              "vectors_count": vectors_count,
              "indexed_vectors_count": indexed_vectors_count,
              "unindexed_points": unindexed_points,
              "unindexed_ratio_pct": unindexed_ratio_pct,
              "segments_count": segments_count,
              "baseline_indexing_threshold": baseline_indexing_threshold,
              "baseline_deleted_threshold": baseline_deleted_threshold,
              "summary": summary_text,
              "audit_manifest": audit_manifest,
              "new_state_snapshot": new_state_snapshot,
          })

  - id: update_indexing_tracker_kv
    type: io.kestra.plugin.core.kv.Set
    description: Persist the latest Qdrant collection indexing metrics and consecutive run history into Kestra KV.
    key: "{{ inputs.cursor_key }}"
    value: "{{ outputs.audit_collection_segments.vars.new_state_snapshot | toJson }}"
    kvType: JSON

  - id: check_optimization_needed
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether the vector collection exhibits excessive unindexed points or stalled optimizers.
    condition: "{{ outputs.audit_collection_segments.vars.needs_optimization == true }}"
    then:
      - id: check_execution_mode
        type: io.kestra.plugin.core.flow.If
        description: Check whether active automated optimization is authorized or safe dry run logging should proceed.
        condition: "{{ not inputs.dry_run and inputs.auto_remediate }}"
        then:
          - id: pause_for_operator_approval
            type: io.kestra.plugin.core.flow.Pause
            description: Pause workflow execution for AI Platform Engineer sign-off before modifying optimizer parameters.
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: Set true to confirm temporary optimizer threshold lowering, aggressive segment vacuuming, and HNSW index rebuild.

          - id: branch_on_approval
            type: io.kestra.plugin.core.flow.If
            description: Execute segment vacuuming and index optimization only if operator approval was explicitly confirmed.
            condition: "{{ outputs.pause_for_operator_approval.onResume.approved == true }}"
            then:
              - id: execute_vacuum_and_indexing
                type: io.kestra.plugin.scripts.python.Script
                description: Apply aggressive optimizer thresholds via Qdrant REST API to force immediate segment merging, poll for completion, and restore baseline config.
                containerImage: python:3.11-slim
                beforeCommands:
                  - pip install requests
                env:
                  QDRANT_URL: "{{ inputs.qdrant_url }}"
                  COLLECTION_NAME: "{{ inputs.collection_name }}"
                  TEMP_INDEXING_THRESH: "{{ inputs.temp_indexing_threshold }}"
                  TEMP_DELETED_THRESH: "{{ inputs.temp_deleted_threshold }}"
                  BASELINE_INDEXING_THRESH: "{{ outputs.audit_collection_segments.vars.baseline_indexing_threshold }}"
                  BASELINE_DELETED_THRESH: "{{ outputs.audit_collection_segments.vars.baseline_deleted_threshold }}"
                  API_KEY: "{{ secret('QDRANT_API_KEY') ?? '' }}"
                script: |
                  import json
                  import os
                  import time
                  import requests

                  try:
                      from kestra import Kestra
                  except ImportError:
                      Kestra = None

                  qdrant_url = os.environ.get("QDRANT_URL", "").rstrip("/")
                  collection_name = os.environ.get("COLLECTION_NAME", "enterprise_knowledge_base")
                  temp_indexing = int(os.environ.get("TEMP_INDEXING_THRESH", "500"))
                  temp_deleted = float(os.environ.get("TEMP_DELETED_THRESH", "0.05"))
                  baseline_indexing = int(os.environ.get("BASELINE_INDEXING_THRESH", "20000"))
                  baseline_deleted = float(os.environ.get("BASELINE_DELETED_THRESH", "0.2"))
                  api_key = os.environ.get("API_KEY", "").strip()

                  headers = {"Content-Type": "application/json", "Accept": "application/json"}
                  if api_key:
                      headers["api-key"] = api_key

                  # 1. Apply aggressive optimizer configuration to force vacuuming and HNSW indexing
                  aggressive_payload = {
                      "optimizers_config": {
                          "indexing_threshold": temp_indexing,
                          "deleted_threshold": temp_deleted,
                          "vacuum_min_vector_number": 500
                      }
                  }
                  print(f"Applying aggressive optimizer parameters to '{collection_name}': {aggressive_payload}")
                  patch_resp = requests.patch(f"{qdrant_url}/collections/{collection_name}", headers=headers, json=aggressive_payload, timeout=20)
                  if patch_resp.status_code != 200:
                      raise ValueError(f"Failed to apply aggressive optimizer config ({patch_resp.status_code}): {patch_resp.text}")

                  # 2. Wait for background optimizers to converge
                  print("Polling collection status for optimizer convergence...")
                  max_wait_seconds = 60
                  poll_interval = 5
                  start_time = time.time()
                  converged = False

                  while time.time() - start_time < max_wait_seconds:
                      time.sleep(poll_interval)
                      check_resp = requests.get(f"{qdrant_url}/collections/{collection_name}", headers=headers, timeout=15)
                      if check_resp.status_code == 200:
                          res = check_resp.json().get("result", {})
                          st = str(res.get("status", "")).lower()
                          opt_st = res.get("optimizer_status", "ok")
                          v_count = int(res.get("vectors_count", 0) or 0)
                          idx_count = int(res.get("indexed_vectors_count", 0) or 0)
                          unidx = max(0, v_count - idx_count)

                          print(f"Elapsed: {int(time.time() - start_time)}s | Status: {st} | Optimizer: {opt_st} | Unindexed: {unidx}")
                          if st == "green" and opt_st == "ok" and unidx <= temp_indexing:
                              converged = True
                              break

                  # 3. Restore baseline optimizer configuration
                  restore_payload = {
                      "optimizers_config": {
                          "indexing_threshold": baseline_indexing,
                          "deleted_threshold": baseline_deleted
                      }
                  }
                  print(f"Restoring baseline optimizer config: {restore_payload}")
                  requests.patch(f"{qdrant_url}/collections/{collection_name}", headers=headers, json=restore_payload, timeout=20)

                  optimization_time_s = round(time.time() - start_time, 2)
                  print(f"Optimization procedure completed in {optimization_time_s}s. Converged: {converged}")

                  if Kestra:
                      Kestra.outputs({
                          "converged": converged,
                          "optimization_time_s": optimization_time_s,
                      })

              - id: verify_optimization_and_canary
                type: io.kestra.plugin.scripts.python.Script
                description: Re-query collection metrics, confirm unindexed vectors decreased, and run a canary ANN vector search to benchmark query latency.
                containerImage: python:3.11-slim
                beforeCommands:
                  - pip install requests
                env:
                  QDRANT_URL: "{{ inputs.qdrant_url }}"
                  COLLECTION_NAME: "{{ inputs.collection_name }}"
                  PRE_UNINDEXED: "{{ outputs.audit_collection_segments.vars.unindexed_points }}"
                  PRE_INDEXED: "{{ outputs.audit_collection_segments.vars.indexed_vectors_count }}"
                  API_KEY: "{{ secret('QDRANT_API_KEY') ?? '' }}"
                script: |
                  import json
                  import os
                  import time
                  from datetime import datetime, timezone
                  import requests

                  try:
                      from kestra import Kestra
                  except ImportError:
                      Kestra = None

                  qdrant_url = os.environ.get("QDRANT_URL", "").rstrip("/")
                  collection_name = os.environ.get("COLLECTION_NAME", "enterprise_knowledge_base")
                  pre_unindexed = int(os.environ.get("PRE_UNINDEXED", "0"))
                  pre_indexed = int(os.environ.get("PRE_INDEXED", "0"))
                  api_key = os.environ.get("API_KEY", "").strip()

                  headers = {"Content-Type": "application/json", "Accept": "application/json"}
                  if api_key:
                      headers["api-key"] = api_key

                  # 1. Inspect updated collection state
                  resp = requests.get(f"{qdrant_url}/collections/{collection_name}", headers=headers, timeout=15)
                  if resp.status_code != 200:
                      raise ValueError(f"Failed to query post-optimization collection state ({resp.status_code}): {resp.text}")

                  res = resp.json().get("result", {})
                  post_status = str(res.get("status", "")).lower()
                  post_vectors = int(res.get("vectors_count", 0) or 0)
                  post_indexed = int(res.get("indexed_vectors_count", 0) or 0)
                  post_unindexed = max(0, post_vectors - post_indexed)
                  post_segments = int(res.get("segments_count", 0) or 0)

                  # 2. Run canary ANN search benchmark
                  vector_size = 128
                  try:
                      params = res.get("config", {}).get("params", {})
                      vectors_cfg = params.get("vectors", {})
                      if isinstance(vectors_cfg, dict) and "size" in vectors_cfg:
                          vector_size = int(vectors_cfg["size"])
                  except Exception:
                      pass

                  dummy_vector = [0.0] * vector_size
                  search_payload = {
                      "vector": dummy_vector,
                      "limit": 5,
                      "with_payload": False
                  }

                  canary_passed = True
                  search_latency_ms = 0.0
                  t0 = time.perf_counter()
                  try:
                      search_resp = requests.post(f"{qdrant_url}/collections/{collection_name}/points/search", headers=headers, json=search_payload, timeout=10)
                      search_latency_ms = round((time.perf_counter() - t0) * 1000.0, 2)
                      if search_resp.status_code not in (200, 201):
                          canary_passed = False
                  except Exception as e:
                      print(f"Canary search warning: {e}")
                      canary_passed = False

                  # Verification criteria:
                  # 1. Unindexed points must have decreased (or be within acceptable nominal limits <= 500)
                  # 2. Indexed vectors must be >= pre_indexed
                  # 3. Canary search benchmark succeeded
                  indexing_improved = (post_unindexed < pre_unindexed) or (post_unindexed <= 500)
                  verification_passed = indexing_improved and canary_passed and (post_status in ("green", "yellow"))

                  print(f"Verification: {'PASSED' if verification_passed else 'FAILED'}")
                  print(f"Unindexed: {pre_unindexed} -> {post_unindexed} | Indexed: {pre_indexed} -> {post_indexed} | Canary Latency: {search_latency_ms} ms")

                  audit_record = {
                      "collection_name": collection_name,
                      "pre_unindexed": pre_unindexed,
                      "post_unindexed": post_unindexed,
                      "pre_indexed": pre_indexed,
                      "post_indexed": post_indexed,
                      "post_status": post_status,
                      "post_segments": post_segments,
                      "canary_passed": canary_passed,
                      "canary_latency_ms": search_latency_ms,
                      "verification_passed": verification_passed,
                      "verified_at": datetime.now(timezone.utc).isoformat(),
                  }

                  if Kestra:
                      Kestra.outputs({
                          "verification_passed": verification_passed,
                          "post_unindexed_points": post_unindexed,
                          "post_indexed_points": post_indexed,
                          "canary_latency_ms": search_latency_ms,
                          "audit_record": audit_record,
                      })

              - id: assert_optimization_verified
                type: io.kestra.plugin.core.flow.If
                description: Abort execution if post-optimization verification failed to confirm unindexed backlog reduction or canary search queries.
                condition: "{{ outputs.verify_optimization_and_canary.vars.verification_passed != true }}"
                then:
                  - id: fail_unresolved_lag
                    type: io.kestra.plugin.core.execution.Fail
                    description: Abort workflow with error diagnostics when Qdrant optimization failed to reduce unindexed points or restore HNSW search performance.
                    errorMessage: "Qdrant segment optimization failed for collection {{ inputs.collection_name }}. Unindexed points did not reduce (was {{ outputs.audit_collection_segments.vars.unindexed_points }}, now {{ outputs.verify_optimization_and_canary.vars.post_unindexed_points }}) or canary ANN query failed. Check worker logs and Qdrant cluster resources."
                else:
                  - id: log_optimization_success
                    type: io.kestra.plugin.core.log.Log
                    description: Record successful Qdrant segment vacuuming, HNSW index convergence, and latency benchmark.
                    message: "Qdrant optimization verified! Collection '{{ inputs.collection_name }}' unindexed points reduced from {{ outputs.audit_collection_segments.vars.unindexed_points }} to {{ outputs.verify_optimization_and_canary.vars.post_unindexed_points }}. Canary ANN search latency: {{ outputs.verify_optimization_and_canary.vars.canary_latency_ms }} ms."

                  - id: save_recovery_audit_kv
                    type: io.kestra.plugin.core.kv.Set
                    description: Persist the recovery audit record into Kestra KV for compliance and operational tracking.
                    key: "qdrant_vacuum_audit_{{ execution.id }}"
                    value: "{{ outputs.verify_optimization_and_canary.vars.audit_record | toJson }}"
                    kvType: JSON

                  - id: notify_resolution_slack
                    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                    description: Dispatch resolution notification to Slack confirming successful segment vacuuming and index convergence.
                    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                    payload: |
                      {
                        "attachments": [
                          {
                            "color": "#2EB67D",
                            "title": ":white_check_mark: Qdrant Vector Collection Indexing & Vacuum Completed",
                            "text": "*Collection:* `{{ inputs.collection_name }}`\n*Endpoint:* `{{ inputs.qdrant_url }}`\n*Unindexed Backlog:* `{{ outputs.audit_collection_segments.vars.unindexed_points }}` -> `{{ outputs.verify_optimization_and_canary.vars.post_unindexed_points }}`\n*Canary ANN Latency:* `{{ outputs.verify_optimization_and_canary.vars.canary_latency_ms }} ms`\n*Execution:* `{{ execution.id }}`"
                          }
                        ]
                      }
            else:
              - id: log_approval_declined
                type: io.kestra.plugin.core.log.Log
                description: Record that the operator declined approval for Qdrant segment vacuuming.
                message: "Operator declined approval for Qdrant segment optimization. Collection '{{ inputs.collection_name }}' optimizer settings left untouched."
        else:
          - id: log_dry_run_plan
            type: io.kestra.plugin.core.log.Log
            description: Log the proposed optimization actions without mutating Qdrant collection settings.
            message: |
              Dry run active or auto_remediate disabled (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}).
              Collection '{{ inputs.collection_name }}' flagged for optimization:
              - Vectors Count: {{ outputs.audit_collection_segments.vars.vectors_count }}
              - Indexed Count: {{ outputs.audit_collection_segments.vars.indexed_vectors_count }}
              - Unindexed Points: {{ outputs.audit_collection_segments.vars.unindexed_points }} ({{ outputs.audit_collection_segments.vars.unindexed_ratio_pct }}%)
              - Segments Count: {{ outputs.audit_collection_segments.vars.segments_count }}
    else:
      - id: log_healthy_state
        type: io.kestra.plugin.core.log.Log
        description: Confirm nominal collection state when unindexed vector counts are within healthy limits.
        message: "Qdrant collection '{{ inputs.collection_name }}' is healthy. Unindexed points ({{ outputs.audit_collection_segments.vars.unindexed_points }}) within thresholds."

errors:
  - id: alert_on_workflow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch emergency alert to Slack if the Qdrant vacuum guard encounters an unhandled execution error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "attachments": [
          {
            "color": "danger",
            "title": ":rotating_light: Qdrant Vacuum Guard Execution Failed",
            "text": "Failed execution `{{ execution.id }}` while auditing or optimizing collection `{{ inputs.collection_name }}` at `{{ inputs.qdrant_url }}`. Check network connectivity, API keys, and worker logs."
          }
        ]
      }

outputs:
  - id: collection_name
    type: STRING
    value: "{{ inputs.collection_name }}"

  - id: initial_unindexed_points
    type: INT
    value: "{{ outputs.audit_collection_segments.vars.unindexed_points ?? 0 }}"

  - id: post_unindexed_points
    type: INT
    value: "{{ outputs.verify_optimization_and_canary.vars.post_unindexed_points ?? outputs.audit_collection_segments.vars.unindexed_points ?? 0 }}"

  - id: canary_latency_ms
    type: FLOAT
    value: "{{ outputs.verify_optimization_and_canary.vars.canary_latency_ms ?? 0.0 }}"

  - id: status
    type: STRING
    value: "{{ (outputs.audit_collection_segments.vars.needs_optimization ?? false) ? ((inputs.auto_remediate and not inputs.dry_run and (outputs.pause_for_operator_approval.onResume.approved ?? false)) ? 'OPTIMIZED' : 'PENDING_APPROVAL') : outputs.audit_collection_segments.vars.overall_status ?? 'HEALTHY' }}"

extend:
  title: Audit and Force Segment Vacuuming and HNSW Indexing in Qdrant Vector Collections
  metaTitle: Qdrant Unindexed Point and Segment Vacuum Guard | Kestra
  shortDescription: Audit Qdrant vector collections for unindexed points and segment bloat, track trends in KV, and trigger vacuuming with operator approval and canary verification.
  metaDescription: Recover Qdrant vector collections from unindexed vector backlogs and dead point bloat. Force segment vacuuming and HNSW indexing with operator approval and canary benchmarks.
  description: |
    Qdrant is an open-source, high-performance vector search engine and vector database designed
    for production Retrieval-Augmented Generation (RAG), multimodal AI applications, and semantic search.
    To support high-throughput writes, Qdrant stores newly incoming vector points in mutable, unindexed
    memory segments. Background optimizers merge these raw segments into immutable segments and build
    Hierarchical Navigable Small World (HNSW) graphs to enable fast Approximate Nearest Neighbor (ANN) search.

    However, during heavy batch ingestions, CDC replication bursts, or frequent document updates and
    deletions, background optimizers can lag behind or stall due to conservative default thresholds:
    1. Unindexed vectors accumulate in flat memory segments, forcing search queries to fall back to
       exhaustive brute-force scans that cause drastic latency spikes.
    2. Deleted or superseded vectors linger as tombstoned "ghost" points inside segments, consuming
       valuable RAM and disk space without being reclaimed.
    3. If background indexing encounters transient errors, collections remain in an unoptimized state indefinitely.

    This blueprint implements an automated, closed-loop Day-2 maintenance guard for Qdrant vector databases.
    It inspects collection metrics via the REST API (`GET /collections/{name}`), calculates unindexed point
    ratios and segment fragmentation, correlates metrics against historical runs stored in Kestra KV,
    requests human operator sign-off through an interactive pause gate, forces aggressive segment merging
    and dead-point vacuuming by temporarily tuning optimizer thresholds, restores baseline configurations,
    and benchmarks vector query search latency using an end-to-end canary ANN search probe.

    ## How it works

    1. **Pre-flight Assertion**: `validate_inputs` (`io.kestra.plugin.core.execution.Assert`) validates the Qdrant REST URL, collection name, threshold bounds, and optimizer parameters.
    2. **Collection Segment Audit**: `audit_collection_segments` (`io.kestra.plugin.scripts.python.Script`) queries `GET /collections/{collection_name}`, analyzes total versus indexed vectors, computes unindexed ratios, inspects segment counts, and captures baseline optimizer settings.
    3. **KV Trend Persistence**: `update_indexing_tracker_kv` (`io.kestra.plugin.core.kv.Set`) saves the latest metrics snapshot and consecutive lagged run counters into Kestra KV.
    4. **Optimization Decision Gate**: `check_optimization_needed` evaluates whether unindexed points or ratios exceed operational thresholds or if the optimizer has reported errors.
    5. **Operator Approval Gate**: When remediation is armed, `pause_for_operator_approval` (`io.kestra.plugin.core.flow.Pause`) halts execution until an AI platform engineer approves the temporary optimizer adjustment.
    6. **Aggressive Vacuum & Indexing**: `execute_vacuum_and_indexing` calls `PATCH /collections/{collection_name}` with lowered `indexing_threshold` and `deleted_threshold` values to force immediate segment compaction and vacuuming, polls for convergence (`status == green`), and restores baseline parameters.
    7. **Post-Optimization Verification & Canary**: `verify_optimization_and_canary` confirms unindexed points decreased, verifies HNSW index expansion, and executes a canary ANN vector search to measure latency in milliseconds.
    8. **Integrity Gate**: `assert_optimization_verified` ensures verification passed and fails loudly via `io.kestra.plugin.core.execution.Fail` if indexing did not improve.
    9. **Audit Trail & Slack Alert**: Archives the remediation manifest in Kestra KV and posts an informative confirmation card to Slack.
    10. **Error Handling**: A flow-level `errors` block dispatches an alert to Slack if an unhandled network or authentication exception occurs.

    ## What you get

    - Automated discovery and health tracking of Qdrant collection segments, unindexed vectors, and optimizer status.
    - Historical trend analysis in Kestra KV to separate bursty batch ingests from chronic indexing lag.
    - Safe human-in-the-loop approval gate before modifying collection optimizer configurations.
    - Automated segment vacuuming and HNSW index rebuilds via the Qdrant REST API.
    - Active verification measuring post-compaction unindexed point reduction and canary ANN search latency.
    - Persistent audit trail of all maintenance operations in Kestra KV.

    ## Who it's for

    - AI/ML Engineers and MLOps Teams operating self-hosted or Qdrant Cloud vector databases.
    - Platform Engineers and SREs responsible for vector search latency SLAs and memory utilization.
    - Teams running streaming RAG ingestion pipelines requiring automated Day-2 database maintenance.

    ## Why orchestrate this with Kestra

    While Qdrant provides REST APIs for collection management, it provides no built-in scheduling, historical trend tracking, approval checkpoints, or safe multi-step vacuum-and-restore orchestration. Running raw shell scripts or ad-hoc cron jobs risks running during peak query traffic and lacks verification. Kestra combines declarative scheduling, distributed KV state tracking, interactive pause approvals, containerized task isolation, and instant Slack notifications to vector database Day-2 operations.

    ## Prerequisites

    - A running Qdrant instance (version 1.5 or higher) reachable from the Kestra worker via HTTP/REST (default port 6333).
    - API key with write permissions if Qdrant authentication is enabled.
    - A Slack Incoming Webhook URL for triage alerts and resolution notices.

    ### Secrets

    - `QDRANT_API_KEY`: API key for Qdrant authentication (leave blank if anonymous access is permitted).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint for optimization alerts.
    - `QDRANT_GUARD_WEBHOOK_KEY`: Secret authentication key for the on-demand webhook trigger.

    ## Quick start

    1. Configure `QDRANT_API_KEY`, `SLACK_WEBHOOK_URL`, and `QDRANT_GUARD_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Import this blueprint and set `qdrant_url` to your cluster's REST endpoint (e.g. `http://localhost:6333`).
    3. Run a manual execution with `dry_run: true` to inspect current unindexed point counts, segment numbers, and optimizer health without altering configuration.
    4. Review the execution logs, candidate metrics, and KV state under `inputs.cursor_key`.
    5. Set `dry_run: false` and `auto_remediate: true` to trigger active optimization; approve the `pause_for_operator_approval` task to trigger segment vacuuming and observe verified ANN latency benchmarks.
    6. Enable the `periodic_indexing_audit` schedule trigger for continuous vector collection health monitoring.

    ## How to extend

    - **Multi-Collection Fanout**: Enumerate all collections via `GET /collections` and wrap the workflow in a loop to maintain every vector index across the cluster.
    - **Payload Schema Indexing**: Add field index creation (`PUT /collections/{name}/index`) for unindexed metadata payload fields that cause slow filter queries.
    - **PagerDuty Integration**: Add `io.kestra.plugin.pagerduty.PagerDutyAlert` when `overall_status` is `CRITICAL_INDEXING_LAG` to page the on-call engineer.

    ## Links

    - [Qdrant Optimizer Documentation](https://qdrant.tech/documentation/concepts/optimizer/)
    - [Qdrant REST API Specification](https://api.qdrant.tech/)
    - [Kestra Python Script Task](https://kestra.io/plugins/plugin-scripts/tasks/io.kestra.plugin.scripts.python.script)
    - [Kestra Key-Value Store Documentation](https://kestra.io/docs/concepts/kv-store)
    - [Kestra Pause Task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)

